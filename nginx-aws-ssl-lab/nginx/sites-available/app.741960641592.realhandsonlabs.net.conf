server {
    server_name app.741960641592.realhandsonlabs.net;

    root /var/www/app.741960641592.realhandsonlabs.net;
    index index2.html;

    location / {
        try_files $uri $uri/ =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/app.741960641592.realhandsonlabs.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/app.741960641592.realhandsonlabs.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = app.741960641592.realhandsonlabs.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name app.741960641592.realhandsonlabs.net;
    return 404; # managed by Certbot
}
